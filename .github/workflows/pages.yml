name: Build Pages
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  auth-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://aevhsdqrirgslfetknip.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_012345678901234567890123456789
      - run: npx playwright test e2e/auth.spec.ts
        env:
          AUTH_E2E_CONFIGURED: '1'
  sql-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run in-memory security tests
        run: |
          npm install --prefix /tmp/nurse-b2-pg --no-save @electric-sql/pglite@0.5.14
          node tests/sql/run-pglite.mjs /tmp/nurse-b2-pg
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-client
      - name: Run isolated PostgreSQL concurrency tests
        run: |
          set -euo pipefail
          pg_bin=$(find /usr/lib/postgresql -path '*/bin/initdb' -printf '%h\n' | sort -V | tail -1)
          test -n "$pg_bin"
          temp_dir=$(mktemp -d /tmp/nurse-b2-ci.XXXXXX)
          trap '"$pg_bin/pg_ctl" -D "$temp_dir/data" -m immediate stop || true; rm -rf "$temp_dir"' EXIT
          mkdir "$temp_dir/socket"
          "$pg_bin/initdb" -D "$temp_dir/data" --auth=trust --no-locale
          "$pg_bin/pg_ctl" -D "$temp_dir/data" -o "-k $temp_dir/socket -c listen_addresses=''" -w start
          "$pg_bin/createdb" -h "$temp_dir/socket" nurse_b2_test_ci
          PATH="$pg_bin:$PATH" tests/sql/run-concurrency.sh "$temp_dir/socket" nurse_b2_test_ci "$(id -un)"
  deploy:
    permissions:
      pages: write
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, auth-mock, sql-review]
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
